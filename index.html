}
  .tweet-card {

    max-width: 350px;
    background-color: #fff;

    border-radius: 12px;
    padding: 10px 15px;

    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    transition: transform 0.2s, box-shadow 0.2s;

    .tweet-text {
      font-size: 13px;
      line-height: 1.4;
      flex: 1;
      margin-right: 10px;
    }
    button {
      padding: 7px 12px;
      background-color: #5fecf3;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;

    const keyword = "THE JOURNEYS OF TWO STARS";
    const fixedHashtags = ["WEIRDO101SeriesEP6"];
    const container = document.getElementById('tweets');

    function renderTweets(category) {
      // 👇 อ่าน emoji ทุกครั้งใหม่
      const emoji = document.getElementById("emojiInput")?.value.trim() || "";
      container.innerHTML = "";

      if (!tweetData[category]) category = "general";

  tweetData[category].forEach(text => {
    const card = document.createElement('div');
    card.className = 'tweet-card';

    const textDiv = document.createElement('div');
    textDiv.className = 'tweet-text';
    textDiv.textContent = text + (emoji ? " " + emoji : "");
    card.appendChild(textDiv);

    const btn = document.createElement('button');
    btn.textContent = 'Tweet Now';
    btn.onclick = () => {
      // อ่าน emoji ตอนกดปุ่มด้วย
      const emojiNow = document.getElementById("emojiInput")?.value.trim() || "";
      const tweetText = `${text}${emojiNow ? " " + emojiNow : ""}\n\n${keyword}\n\n#${fixedHashtags[0]}`;
      const url = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(tweetText);
      window.open(url, '_blank');
    };
    card.appendChild(btn);

    container.appendChild(card);
  });
}

  function initTabs() {
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const category = tab.dataset.category;
      renderTweets(category); 
    });
  });

  const first = document.querySelector('.tab.active') || document.querySelector('.tab');
  if (first) renderTweets(first.dataset.category);
}

document.getElementById('emojiInput')?.addEventListener('input', () => {
  const active = document.querySelector('.tab.active');
  if (active) renderTweets(active.dataset.category);
});

document.addEventListener('DOMContentLoaded', initTabs);
</script>
