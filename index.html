    .tab {

    text-align: center;
    padding: 8px 15px;
    border-radius: 8px;
    border: 2px solid #ca7ce9;
    background: #fff;
    cursor: pointer;
    font-weight: bold;
    color: #ca7ce9;
    transition: 0.2s;
  }

  .tab.th {
    border: 2px solid #ca7ce9;
    background: #fff;
    color: #ca7ce9;
  }
  .tab.thai.active, .tab.th:hover {
    background: #ca7ce9;
    color: #fff;
  }

  .tab.eng {
    border: 2px solid #4cafef;
    background: #fff;
    color: #4cafef;
  }
  .tab.eng.active, .tab.eng:hover {
    background: #4cafef;

    /* Tweet Cards */
    .tweet-container {
    display: grid;
    grid-template-columns: 1fr; /* เปลี่ยนเป็นคอลัมน์เดียว */
    gap: 15px;  /* ระยะห่างระหว่างการ์ด */
    justify-items: center; /* จัดให้อยู่ตรงกลาง */
    margin-top: 20px;
}
  .tweet-card {
    width: 90%; /* ให้การ์ดปรับตามคอลัมน์ */
    max-width: 350px;
    background-color: #fff;
    border: 2px solid #ff4081;
    border-radius: 12px;
    padding: 10px 15px;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    transition: transform 0.2s, box-shadow 0.2s;
  }
    .tweet-text {
      font-size: 13px;
      line-height: 1.4;
      flex: 1;
      margin-right: 10px;
    }
    button {
      padding: 7px 12px;
      background-color: #f76fcc;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: background-color 0.2s;
      white-space: nowrap;
    }
    button:hover {
      background-color: #ff4081;
    }

    const keyword = "BELOVED OR FORGOTTEN PERSON";
    const fixedHashtags = ["MuTeLuvHiByMyLuckFinalEP"];
    const container = document.getElementById('tweets');

    function renderTweets(category) {
      // 👇 อ่าน emoji ทุกครั้งใหม่
      const emoji = document.getElementById("emojiInput")?.value.trim() || "";
      container.innerHTML = "";

      if (!tweetData[category]) category = "general";

  tweetData[category].forEach(text => {
    const card = document.createElement('div');
    card.className = 'tweet-card';

    const textDiv = document.createElement('div');
    textDiv.className = 'tweet-text';
    textDiv.textContent = text + (emoji ? " " + emoji : "");
    card.appendChild(textDiv);

    const btn = document.createElement('button');
    btn.textContent = 'Tweet Now';
    btn.onclick = () => {
      // อ่าน emoji ตอนกดปุ่มด้วย
      const emojiNow = document.getElementById("emojiInput")?.value.trim() || "";
      const tweetText = `${text}${emojiNow ? " " + emojiNow : ""}\n\n${keyword}\n\n#${fixedHashtags[0]}`;
      const url = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(tweetText);
      window.open(url, '_blank');
    };
    card.appendChild(btn);

    container.appendChild(card);
  });
}

  function initTabs() {
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const category = tab.dataset.category;
      renderTweets(category); 
    });
  });

  const first = document.querySelector('.tab.active') || document.querySelector('.tab');
  if (first) renderTweets(first.dataset.category);
}

document.getElementById('emojiInput')?.addEventListener('input', () => {
  const active = document.querySelector('.tab.active');
  if (active) renderTweets(active.dataset.category);
});

document.addEventListener('DOMContentLoaded', initTabs);
</script>
